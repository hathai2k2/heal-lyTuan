<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Đang chuyển hướng tới Tool Refactor...</title>
  <style>
    body { background: #151519; color: #e2e2e8; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { text-align: center; padding: 24px; border: 1px solid #2b2b33; border-radius: 12px; background: #1c1c22; }
    a { color: #7aa2f7; text-decoration: none; font-weight: 600; }
  </style>
  <script>
    (async function() {
      const fallbackUrl = "https://affiliated-pursue-minimize-month.trycloudflare.com";
      try {
        const res = await fetch("https://raw.githubusercontent.com/hathai2k2/heal-lyTuan/master/refactor/url.txt?t=" + Date.now(), { cache: "no-store" });
        if (res.ok) {
          const liveUrl = (await res.text()).trim();
          if (liveUrl.startsWith("https://")) {
            window.location.replace(liveUrl);
            return;
          }
        }
      } catch (e) {}
      window.location.replace(fallbackUrl);
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://affiliated-pursue-minimize-month.trycloudflare.com">
  </noscript>
</head>

    <p>Đang mở <strong>Tool Refactor (Android Source Refactoring Suite)</strong>...</p>

  </div>
